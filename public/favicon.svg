<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30">
  <title>Weave Patterner</title>
  <rect width="30" height="30" rx="9" fill="#D6246E"/>
  <!-- A twill line stepping down the cloth -->
  <g fill="#FFFFFF">
    <rect x="7" y="7" width="4" height="4" rx="1.3"/><rect x="11" y="7" width="4" height="4" rx="1.3"/>
    <rect x="11" y="11" width="4" height="4" rx="1.3"/><rect x="15" y="11" width="4" height="4" rx="1.3"/>
    <rect x="15" y="15" width="4" height="4" rx="1.3"/><rect x="19" y="15" width="4" height="4" rx="1.3"/>
    <rect x="19" y="19" width="4" height="4" rx="1.3"/><rect x="7" y="19" width="4" height="4" rx="1.3"/>
  </g>
</svg>
