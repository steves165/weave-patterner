name: Desktop app

# Builds the desktop app for Windows, macOS and Linux when a version tag (v1.2.3, matching package.json) is pushed,
# and puts the installers on that version's GitHub release. Run it by hand to check the builds without releasing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The desktop app's own tests, against Electron itself (on a virtual display).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: xvfb-run --auto-servernum npx playwright test -c playwright.desktop.config.ts

  # The release the installers go on, made once so the three builds don't each try to.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" \
            --title "Weave Patterner $GITHUB_REF_NAME for the desktop" \
            --notes "Weave, Knit and Sew Patterner as a desktop app. Download the installer for your computer below:

          - **Windows**: Weave-Patterner-…-win-x64.exe. Windows may say it protected your PC (the app isn't code-signed yet): choose **More info › Run anyway**.
          - **macOS**: …-mac-arm64.dmg for Apple silicon (M1 and later), …-mac-x64.dmg for Intel. The first time, macOS may say it can't check the app: open **System Settings › Privacy & Security** and choose **Open Anyway**.
          - **Linux**: …-linux-x86_64.AppImage. Make it executable (chmod +x) and run it.

          Your patterns are kept in the app. To bring patterns from the website, use **Load › Back up or restore…** there, then restore the file in the app."

  build:
    needs: [test, release]
    if: always() && needs.test.result == 'success' && needs.release.result != 'failure'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx tsx scripts/desktop.ts
      # Tags publish to the release; a run by hand just builds, and keeps the installers as a workflow artifact.
      - run: npx electron-builder --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
          if-no-files-found: error
          retention-days: 14
