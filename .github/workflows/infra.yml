name: Infrastructure

# Deploys the feedback form's endpoint (infra/feedback, Terraform) when it changes on main. Run it by hand to plan
# (show what would change, and change nothing) or apply. Pull requests only check it (formatting and validation, no
# AWS). The plan is shown on the run's summary page. It signs in to AWS with GitHub's OIDC token as the
# role infra/bootstrap made, which only main can take and which can only manage the feedback resources.
#
# Running it also turns the endpoint back on after its kill switch (reserved concurrency back to 1).
on:
  push:
    branches: [main]
    paths: ['infra/feedback/**', '.github/workflows/infra.yml']
  pull_request:
    paths: ['infra/feedback/**', '.github/workflows/infra.yml']
  workflow_dispatch:
    inputs:
      action:
        description: 'plan shows what would change; apply changes it'
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read

# One deploy at a time, never cancelled halfway.
concurrency:
  group: infra-feedback
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/feedback init -backend=false
      - run: terraform -chdir=infra/feedback validate

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Where the kill switch's email goes (a repository variable, so it isn't in the public code).
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::557467970586:role/weave-patterner-terraform-ci
          aws-region: eu-west-2
      - run: terraform -chdir=infra/feedback init
      - name: Plan
        run: |
          terraform -chdir=infra/feedback plan -no-color -out=feedback.tfplan | tee plan.txt
          {
            echo '### Terraform plan: infra/feedback'
            echo '```'
            grep -E '^  # |^Plan:|^No changes' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Pushes to main apply; a run by hand applies only when asked to.
      - name: Apply
        if: github.event_name == 'push' || inputs.action == 'apply'
        run: terraform -chdir=infra/feedback apply -no-color feedback.tfplan
