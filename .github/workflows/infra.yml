name: Infrastructure

# Deploys the feedback form's endpoint (infra/feedback, Terraform) when it changes on main, or when run by hand.
# Pull requests only check it (formatting and validation, no AWS). It signs in to AWS with GitHub's OIDC token as the
# role infra/bootstrap made, which only main can take and which can only manage the feedback resources.
#
# Running it also turns the endpoint back on after its kill switch (reserved concurrency back to 1).
on:
  push:
    branches: [main]
    paths: ['infra/feedback/**', '.github/workflows/infra.yml']
  pull_request:
    paths: ['infra/feedback/**', '.github/workflows/infra.yml']
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, never cancelled halfway.
concurrency:
  group: infra-feedback
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/feedback init -backend=false
      - run: terraform -chdir=infra/feedback validate

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Where the kill switch's email goes (a repository variable, so it isn't in the public code).
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::557467970586:role/weave-patterner-terraform-ci
          aws-region: eu-west-2
      - run: terraform -chdir=infra/feedback init
      - run: terraform -chdir=infra/feedback plan -out=feedback.tfplan
      - run: terraform -chdir=infra/feedback apply feedback.tfplan
