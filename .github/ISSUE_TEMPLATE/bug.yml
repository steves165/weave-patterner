name: Bug
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Tools → …
        2. …
  - type: input
    id: device
    attributes:
      label: Browser and device
      placeholder: e.g. Chrome on Windows, Safari on iPad
  - type: textarea
    id: extra
    attributes:
      label: Pattern file or screenshot
      description: Drag in a .weave.json, a WIF or a screenshot if it helps.
